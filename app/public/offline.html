<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline | ThrivvSkale CRM</title>
  <!--
    Shown by the service worker (public/sw.js) when a page cannot be loaded because
    there is no connection. Self-contained on purpose: no scripts or styles from the
    app, because the app itself is not reachable. Precached when the worker installs.
  -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #dfe3f5, #f2f2f7); color: #111116;
    }
    main {
      max-width: 26rem; padding: 28px; border-radius: 28px; background: #ffffff;
      box-shadow: 0 24px 64px rgba(20, 20, 40, 0.18);
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 20px; line-height: 1.5; color: #3a3a44; }
    button {
      font: inherit; font-weight: 600; padding: 10px 20px; border: 0; border-radius: 999px;
      background: #111116; color: #ffffff; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(135deg, #1c1c24, #0a0a10); color: #f5f5f7; }
      main { background: #24242d; box-shadow: none; }
      p { color: #d0d0d8; }
      button { background: #f5f5f7; color: #111116; }
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>ThrivvSkale CRM needs a connection to show your leads and calls. Check your network, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
