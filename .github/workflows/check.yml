# Runs the CRM's typecheck, lint, unit tests and production build on every push
# and pull request that touches app/. Browser (e2e) and database tests are not
# run here: they need the local Supabase stack and a dev server.
name: check

on:
  push:
    paths: ['app/**', '.github/workflows/check.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      # The build needs the three Supabase settings to exist; these are dummy
      # values, nothing is contacted during the build.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
